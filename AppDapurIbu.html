<style>
  :root{
    --pink:#ec4899; --purple:#7c3aed;
    --grad: linear-gradient(135deg,#ec4899 0%,#a855f7 55%,#7c3aed 100%);
    --bg:#faf7fc; --card:#ffffff; --ink:#2a1e30; --muted:#8a7a92; --line:#eee2f2;
    --ok:#16a34a; --ok-bg:#f0fdf4; --warn:#e11d48; --warn-bg:#fef2f2; --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}

  #loadingScreen{min-height:100vh;display:flex;justify-content:center;align-items:center;background:var(--grad);color:#fff;font-size:14px;}

  #loginScreen{min-height:100vh;display:none;flex-direction:column;justify-content:center;padding:32px 28px;background:var(--grad);}
  .logo-word{font-family:'Pacifico',cursive;color:#fff;font-size:42px;text-align:center;margin:0 0 4px;text-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .logo-sub{color:rgba(255,255,255,0.9);text-align:center;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:32px;font-weight:600;}
  .login-card{background:#fff;border-radius:20px;padding:26px 24px;box-shadow:0 20px 40px rgba(60,10,60,0.25);}
  .login-card h2{margin:0 0 4px;font-size:18px;font-weight:700;}
  .login-card p.hint{margin:0 0 18px;color:var(--muted);font-size:12.5px;line-height:1.5;}
  .err-msg{background:#fef2f2;color:var(--warn);padding:10px 12px;border-radius:10px;font-size:12.5px;margin-top:12px;display:none;}
  .login-foot{text-align:center;color:rgba(255,255,255,0.85);font-size:12px;margin-top:22px;}

  #appScreen{display:none;padding-bottom:90px;}
  .topbar{background:var(--grad);color:#fff;padding:20px 20px 22px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:10;}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;}
  .topbar-word{font-family:'Pacifico',cursive;font-size:26px;}
  .role-chip{background:rgba(255,255,255,0.22);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
  .topbar-user{font-size:13px;opacity:0.9;margin-top:6px;}
  .logout-btn{background:none;border:1.5px solid rgba(255,255,255,0.5);color:#fff;border-radius:10px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600;}

  .page{padding:18px;}
  .page h1{font-size:19px;margin:0 0 4px;}
  .page p.sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .back-link{background:none;border:none;color:var(--purple);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:4px;}

  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px;}
  .menu-tile{background:var(--card);border-radius:16px;padding:18px 8px;text-align:center;box-shadow:0 3px 10px rgba(124,58,237,0.08);border:1px solid var(--line);cursor:pointer;transition:transform .1s;}
  .menu-tile:active{transform:scale(0.95);}
  .menu-tile .ic{font-size:26px;display:block;margin-bottom:8px;}
  .menu-tile .lb{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;}

  .placeholder-card{background:var(--card);border-radius:var(--radius);padding:32px 20px;text-align:center;border:1.5px dashed var(--line);color:var(--muted);}
  .placeholder-card .ic{font-size:36px;display:block;margin-bottom:10px;}
  .placeholder-card h3{color:var(--ink);margin:0 0 6px;font-size:16px;}
  .placeholder-card p{font-size:13px;margin:0;line-height:1.5;}

  .card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--line);margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:14px;font-weight:700;}
  .card h4{margin:14px 0 8px;font-size:12.5px;font-weight:700;color:var(--purple);}
  .stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .lb{color:var(--muted);}
  .stat-row .val{font-weight:700;}
  .stat-big{text-align:center;padding:8px 0 16px;}
  .stat-big .num{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-big .lb{font-size:12px;color:var(--muted);font-weight:600;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:12px 0 6px;}
  input[type=email],input[type=password],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px;font-family:inherit;background:#fbf9fc;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);background:#fff;}
  input[readonly]{background:#f3eef6;color:var(--muted);}
  .btn-primary{width:100%;margin-top:16px;padding:13px;border:none;border-radius:14px;background:var(--grad);color:#fff;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;}

  .btn-secondary{width:100%;margin-top:8px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;}

  .denom-table{width:100%;border-collapse:collapse;margin-top:6px;}
  .denom-table th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:6px 4px;border-bottom:1.5px solid var(--line);}
  .denom-table td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .denom-table td.dv{font-weight:700;}
  .denom-table input{padding:8px;text-align:center;font-size:13px;}
  .denom-table td.dt{text-align:right;font-weight:700;color:var(--purple);}

  .banner{border-radius:14px;padding:14px 16px;font-size:13.5px;font-weight:700;text-align:center;margin-top:14px;}
  .banner.ok{background:var(--ok-bg);color:var(--ok);}
  .banner.warn{background:var(--warn-bg);color:var(--warn);}

  .entry-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px;}
  .entry-item:last-child{border-bottom:none;}
  .entry-item .pm-tag{background:#f3e8ff;color:var(--purple);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;margin-right:6px;}
  .entry-item .amt{font-weight:700;white-space:nowrap;}
  .entry-item .time{color:var(--muted);font-size:11px;}
  .entry-item .sub2{color:var(--muted);font-size:11px;margin-top:2px;}
  .del-btn{background:var(--warn-bg);color:var(--warn);border:none;border-radius:8px;width:26px;height:26px;flex-shrink:0;font-size:13px;font-weight:700;cursor:pointer;}

  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,0.05);}
  .nav-item{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;padding:4px 6px;flex:1;}
  .nav-item.active{color:var(--purple);}
  .nav-item .ic{font-size:19px;}

  .spin-note{text-align:center;color:var(--muted);font-size:12.5px;padding:20px;}
</style>
</head>

/* ============ TOAST & CONFIRM ============ */
function toast(msg, isError){
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.style.cssText = `background:${isError?'#e11d48':'#2a1e30'};color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;margin-top:8px;box-shadow:0 6px 20px rgba(0,0,0,0.25);text-align:center;`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}
function showConfirm(msg, onConfirm){
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmModal').style.display = 'flex';
  const okBtn = document.getElementById('confirmOkBtn');
  const cancelBtn = document.getElementById('confirmCancelBtn');
  const cleanup = () => { document.getElementById('confirmModal').style.display = 'none'; okBtn.onclick = null; cancelBtn.onclick = null; };
  okBtn.onclick = () => { cleanup(); onConfirm(); };
  cancelBtn.onclick = cleanup;
}

function showPasswordPrompt(msg, onSubmit){
  document.getElementById('pwMsg').textContent = msg;

  input.value = '';

}

/* ============ HELPERS ============ */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoToDisplay(iso){ if(!iso) return '-'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function todayStr(){ return isoToDisplay(todayISO()); }
function nowTimeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtRM(n){ return 'RM ' + (Math.round((n||0)*100)/100).toFixed(2); }

/* ============ MENU (tiada login — semua staff nampak semua) ============ */
const ALL_MENU = [
  {id:'dashboard', ic:'🏠', lb:'Dashboard'},
  {id:'resepi',    ic:'📖', lb:'Resepi Saya'},
  {id:'scan',      ic:'📷', lb:'Scan Resepi'},
  {id:'tambah',    ic:'➕', lb:'Tambah Resepi'},
  {id:'sales',     ic:'💰', lb:'Sales Harian'},
  {id:'drawer',    ic:'💵', lb:'Cash Drawer'},
  {id:'laporan',   ic:'📊', lb:'Laporan'},
  {id:'tetapan',   ic:'⚙️', lb:'Tetapan'},
];
const BOTTOM_NAV_IDS = ['dashboard','sales','drawer','laporan','resepi'];

/* ============ START (tiada login) ============ */
function init(){
  appShown = true;
  renderMenu(); renderBottomNav();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  openModule('dashboard');
}

function renderMenu(){
  const grid = document.getElementById('mainMenuPage');
  grid.innerHTML='';
  ALL_MENU.forEach(m=>{
    const t=document.createElement('div');
    t.className='menu-tile';
    t.onclick=()=>openModule(m.id);
    t.innerHTML=`<span class="ic">${m.ic}</span><span class="lb">${m.lb}</span>`;
    grid.appendChild(t);
  });
}
function renderBottomNav(){
  const nav=document.getElementById('bottomNav');
  nav.innerHTML='';
  BOTTOM_NAV_IDS.forEach(id=>{
    const m=ALL_MENU.find(x=>x.id===id);
    const b=document.createElement('button');
    b.className='nav-item'; b.id='nav-'+id;
    b.onclick=()=>openModule(id);
    b.innerHTML=`<span class="ic">${m.ic}</span><span>${m.lb}</span>`;
    nav.appendChild(b);
  });
}

/* ============ ROUTER ============ */
async function openModule(id){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const navBtn=document.getElementById('nav-'+id);
  if(navBtn) navBtn.classList.add('active');

  const menuGrid = document.getElementById('mainMenuPage');
  const mod = document.getElementById('modulePage');
  const oldSummary = document.getElementById('dashSummary');
  if(oldSummary) oldSummary.remove();

  if(id==='dashboard'){
    menuGrid.style.display='grid'; mod.style.display='none';
    await renderDashboard();
    return;
  }
  menuGrid.style.display='none'; mod.style.display='block';
  mod.innerHTML = `<p class="spin-note">Memuatkan data...</p>`;

  const renderers = { sales: renderSales, drawer: renderDrawer, laporan: renderLaporan, resepi: renderResepiList, tambah: renderTambahResepi, scan: renderScanResepi };
  if(renderers[id]) await renderers[id](); else renderPlaceholder(id);
}
function backToMenu(){ openModule('dashboard'); }
function renderPlaceholder(id){
  const m = ALL_MENU.find(x=>x.id===id);
  document.getElementById('modulePage').innerHTML = `
    <button class="back-link" onclick="backToMenu()">← Kembali</button>
    <h1>${m.lb}</h1>
    <div class="placeholder-card"><span class="ic">🛠️</span><h3>Sedang dibina</h3><p>Modul ini akan diisi kemudian.</p></div>`;
}

/* ============ DATA: SALES HARIAN ============ */
const PAY_METHODS = [
  {id:'cash', label:'Cash', ic:'💵'},
  {id:'qrtransfer', label:'QR/Transfer', ic:'📲'},
  {id:'shopeefood', label:'ShopeeFood', ic:'🛵'},
  {id:'foodpanda', label:'Foodpanda', ic:'🐼'},
  {id:'lain', label:'Lain-lain', ic:'➕'},
];
let salesEntries = [];
let vendorSales = [];

async function loadSalesEntries(){
  const { data, error } = await supabaseClient.from('sales_entries').select('*').eq('tarikh', todayISO()).order('created_at');
  salesEntries = error ? [] : data.map(r=>({ id:r.id, method:r.method, amount:Number(r.amount), note:r.note||'', time:r.waktu||'' }));
}
async function loadVendorSales(){
  const { data, error } = await supabaseClient.from('vendor_sales').select('*').eq('tarikh_bayaran', todayISO()).order('created_at');
  vendorSales = error ? [] : data.map(r=>({ id:r.id, kedai:r.kedai, noResit:r.no_resit||'', tarikhHantar:r.tarikh_hantar||'-', kaedahBayaran:r.kaedah_bayaran||'cash', jumlah:Number(r.jumlah), tarikhBayaran: isoToDisplay(r.tarikh_bayaran) }));
}
function salesTotals(){
  const t = {grand:0};
  PAY_METHODS.forEach(pm=>t[pm.id]=0);
  salesEntries.forEach(e=>{ t[e.method]=(t[e.method]||0)+e.amount; });
  const vendorTotal = vendorSales.reduce((s,v)=>s+v.jumlah,0);
  t.vendor = vendorTotal;
  t.grand = PAY_METHODS.reduce((s,pm)=>s+t[pm.id],0) + vendorTotal;
  return t;
}

/* ============ DATA: CASH DRAWER ============ */
const DENOMS = [100,50,20,10,5,1,'0.5','0.2','0.1','0.05'];
function denomLabel(d){ return (d>=1)? ('RM'+d) : (Math.round(d*100)+' sen'); }
function denomTotalOf(obj){ return DENOMS.reduce((s,d)=> s + (obj[d]||0)*Number(d), 0); }
function emptyDenom(){ const o={}; DENOMS.forEach(d=>o[d]=0); return o; }

let cashDrawerRowId = null;
let openingCash = { employee:'', time:'', amount:0 };
let openDenom = emptyDenom();
let closeDenom = emptyDenom();
let closing = null;

async function loadCashDrawerToday(){
  const { data, error } = await supabaseClient.from('cash_drawer_days').select('*').eq('tarikh', todayISO()).maybeSingle();
  if(error || !data){
    cashDrawerRowId = null;
    openingCash = { employee:'', time:'', amount:0 };
    openDenom = emptyDenom(); closeDenom = emptyDenom(); closing = null;
    return;
  }
  cashDrawerRowId = data.id;
  openingCash = { employee: data.opening_employee||'', time: data.opening_time||'', amount: Number(data.opening_amount)||0 };
  openDenom = Object.assign(emptyDenom(), data.opening_denom||{});
  closeDenom = Object.assign(emptyDenom(), data.closing_denom||{});
  closing = data.is_closed ? {
    closeEmp: data.closing_employee, closeTime: data.closing_time,
    cashOut: Number(data.cash_out)||0, bankIn: Number(data.bank_in)||0, expense: Number(data.expense)||0,
    serahIbu: Number(data.serah_ibu)||0, physical: Number(data.physical)||0, expected: Number(data.expected)||0,
    diff: Number(data.diff)||0, statusLabel: data.status_label, statusType: data.status_type, bakiAkhir: Number(data.baki_akhir)||0,
  } : null;
}
function currentCashEstimate(){ return openingCash.amount + (salesTotals().cash||0); }

/* ============ DASHBOARD ============ */
async function renderDashboard(){
  document.getElementById('mainMenuPage').insertAdjacentHTML('afterend', `<div id="dashSummary" class="page" style="padding-bottom:0;"><p class="spin-note">Memuatkan...</p></div>`);
  await Promise.all([loadSalesEntries(), loadVendorSales(), loadCashDrawerToday()]);
  const totals = salesTotals();
  const div = document.getElementById('dashSummary');
  div.innerHTML = `
    <div class="card">
      <div class="stat-big"><div class="num">${fmtRM(totals.grand)}</div><div class="lb">JUMLAH SALES HARI INI</div></div>
      ${PAY_METHODS.map(pm=>`<div class="stat-row"><span class="lb">${pm.ic} ${pm.label}</span><span class="val">${fmtRM(totals[pm.id]||0)}</span></div>`).join('')}
      <div class="stat-row"><span class="lb">🧾 Jualan Vendor (Shell Tart)</span><span class="val">${fmtRM(totals.vendor)}</span></div>

function renderDenomTable(groupId, stateObj){
  return `
    <table class="denom-table">
      <tr><th>Nilai</th><th>Bilangan</th><th style="text-align:right;">Jumlah</th></tr>
      ${DENOMS.map(d=>`

          <td class="dv">${denomLabel(d)}</td>
          <td><input type="number" min="0" data-group="${groupId}" data-denom="${d}" value="${stateObj[d]||0}" oninput="onDenomChange('${groupId}')"></td>
          <td class="dt" id="dt-${groupId}-${d}">${fmtRM((stateObj[d]||0)*Number(d))}</td>
        </tr>`).join('')}
    </table>
    <div class="stat-row" style="margin-top:4px;"><span class="lb" style="font-weight:700;">Jumlah</span><span class="val" id="total-${groupId}" style="font-size:15px;">${fmtRM(denomTotalOf(stateObj))}</span></div>
  `;
}
function onDenomChange(groupId){
  const stateObj = groupId==='open' ? openDenom : closeDenom;
  document.querySelectorAll(`[data-group="${groupId}"]`).forEach(inp=>{
    const d = inp.getAttribute('data-denom');
    const val = parseInt(inp.value)||0;
    stateObj[d]=val;
    document.getElementById(`dt-${groupId}-${d}`).textContent = fmtRM(val*Number(d));
  });
  document.getElementById('total-'+groupId).textContent = fmtRM(denomTotalOf(stateObj));
  if(groupId==='close') updateBakiAkhirLive();
}
function updateBakiAkhirLive(){
  const el = document.getElementById('serahIbu');
  const serahIbu = el ? (parseFloat(el.value)||0) : 0;
  const physical = denomTotalOf(closeDenom);
  const out = document.getElementById('bakiAkhirLive');
  if(out) out.textContent = fmtRM(physical - serahIbu);
}

  } else {

async function doClosing(){
  const totals = salesTotals();
  const closeEmp = document.getElementById('closeEmp').value.trim() || 'Pekerja';
  const closeTime = document.getElementById('closeTime').value.trim() || '00:00';
  const cashOut = parseFloat(document.getElementById('cashOut').value)||0;
  const bankIn = parseFloat(document.getElementById('bankIn').value)||0;
  const expense = parseFloat(document.getElementById('expense').value)||0;
  const serahIbu = parseFloat(document.getElementById('serahIbu').value)||0;
  const note = document.getElementById('closeNote').value.trim();
  const physical = denomTotalOf(closeDenom);

  const expected = openingCash.amount + (totals.cash||0) - cashOut - bankIn - expense;
  const diff = Math.round((physical - expected)*100)/100;
  let statusLabel, statusType;
  if(diff===0){ statusLabel='✅ Cash drawer seimbang. Tiada perbezaan.'; statusType='ok'; }
  else if(diff>0){ statusLabel=`⚠️ Cash lebih sebanyak ${fmtRM(diff)}.`; statusType='warn'; }
  else { statusLabel=`⚠️ Cash kurang sebanyak ${fmtRM(Math.abs(diff))}.`; statusType='warn'; }
  const bakiAkhir = Math.round((physical - serahIbu)*100)/100;

  const btn = document.getElementById('closeSaveBtn'); btn.disabled=true; btn.textContent='Menyimpan...';
  const payload = {
    closing_employee: closeEmp, closing_time: closeTime, cash_out: cashOut, bank_in: bankIn, expense, serah_ibu: serahIbu,
    closing_denom: closeDenom, physical, expected, diff, status_label: statusLabel, status_type: statusType, baki_akhir: bakiAkhir,
    note, is_closed: true, updated_at: new Date().toISOString(),
  };
  let error;
  if(cashDrawerRowId){
    ({error} = await supabaseClient.from('cash_drawer_days').update(payload).eq('id', cashDrawerRowId));
  } else {
    const { data, error: insErr } = await supabaseClient.from('cash_drawer_days').insert({ tarikh: todayISO(), ...payload }).select().single();
    error = insErr;
    if(!error && data) cashDrawerRowId = data.id;
  }
  btn.disabled=false; btn.textContent='Kemaskini Tutup Kedai';
  if(error){ toast('Ralat simpan: ' + error.message, true); return; }

  closing = { closeEmp, closeTime, expected, physical, diff, statusLabel, statusType, cashOut, bankIn, expense, serahIbu, bakiAkhir, note };
  showClosingResult(closing);
  toast('Tutup kedai disimpan.');
}

/* ============ LAPORAN / SEJARAH ============ */
async function computeDayTotals(dateISO){
  const [{data:se}, {data:vs}] = await Promise.all([
    supabaseClient.from('sales_entries').select('method, amount').eq('tarikh', dateISO),
    supabaseClient.from('vendor_sales').select('jumlah').eq('tarikh_bayaran', dateISO),
  ]);
  const t = {grand:0}; PAY_METHODS.forEach(pm=>t[pm.id]=0);
  (se||[]).forEach(r=>{ t[r.method]=(t[r.method]||0)+Number(r.amount); });
  const vendorTotal = (vs||[]).reduce((s,r)=>s+Number(r.jumlah),0);
  t.vendor = vendorTotal;
  t.grand = PAY_METHODS.reduce((s,pm)=>s+t[pm.id],0) + vendorTotal;
  return t;
}

const UNIT_OPTIONS = ['gram','kilogram','mililiter','liter','sudu teh','sudu besar','cawan','biji','lain-lain'];
let bahanRows = [];
let resepiEditId = null;
let scannedPrefill = null;
let resepiSearch = '', resepiFilterKategori = '', resepiSort = 'nama';

function newBahanRow(){ return { rid: Date.now()+Math.random(), nama:'', kuantiti:'', unit:'gram' }; }

async function loadRecipes(){
  const { data, error } = await supabaseClient.from('recipes').select('*').eq('archived', false).order('nama');
  recipes = error ? [] : data.map(r=>({
    id:r.id, nama:r.nama, kategori:r.kategori, gambar:r.gambar, bahan:r.bahan||[],
    caraPenyediaan:r.cara_penyediaan||'', suhuOven:r.suhu_oven||'', masaMasak:r.masa_masak||'',
    saizLoyang:r.saiz_loyang||'', jumlahHasil:r.jumlah_hasil||'', nota:r.nota||'',
    favorite:r.favorite, archived:r.archived,

  }));
}

async function renderTambahResepi(editId, fromScan){

  const src = editing || prefill;
  bahanRows = src && src.bahan && src.bahan.length ? src.bahan.map(b=>({...b, rid: Date.now()+Math.random()})) : [newBahanRow()];

    ${hasUnclear ? `<div class="banner warn" style="text-align:left;">⚠️ Ada bahagian bertanda [TIDAK JELAS] — sila semak &amp; betulkan sebelum simpan.</div>` : ''}

    <div class="card">
      <label>Nama Resepi</label>
      <input type="text" id="rNama" placeholder="Contoh: Shell Tart Original" value="${src?src.nama:''}">
      <label>Kategori</label>
      <select id="rKategori">${recipeCategories.map(c=>`<option value="${c}" ${src&&src.kategori===c?'selected':''}>${c}</option>`).join('')}</select>

      <input type="file" id="rGambar" accept="image/*" onchange="previewRecipeImage(event)">

    </div>
  `;

function renderBahanRows(){
  return bahanRows.map((b)=>`
    <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
      <input type="text" placeholder="Nama bahan" value="${b.nama}" oninput="updateBahanRow('${b.rid}','nama',this.value)" style="flex:2;">
      <input type="text" placeholder="Kuantiti" value="${b.kuantiti}" oninput="updateBahanRow('${b.rid}','kuantiti',this.value)" style="flex:1;">
      <select onchange="updateBahanRow('${b.rid}','unit',this.value)" style="flex:1.3;">${UNIT_OPTIONS.map(u=>`<option value="${u}" ${b.unit===u?'selected':''}>${u}</option>`).join('')}</select>
      ${bahanRows.length>1 ? `<button class="del-btn" onclick="removeBahanRow('${b.rid}')">✕</button>` : ''}

function addBahanRow(){ bahanRows.push(newBahanRow()); document.getElementById('bahanRowsWrap').innerHTML = renderBahanRows(); }
function removeBahanRow(rid){ bahanRows = bahanRows.filter(b=>b.rid!=rid); document.getElementById('bahanRowsWrap').innerHTML = renderBahanRows(); }
function updateBahanRow(rid, field, val){ const b = bahanRows.find(x=>x.rid==rid); if(b) b[field]=val; }
function previewRecipeImage(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('rGambarPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;border-radius:12px;max-height:180px;object-fit:cover;">`; };

async function saveResepi(){
  const nama = document.getElementById('rNama').value.trim();
  if(!nama){ toast('Sila isi nama resepi.', true); return; }
  const imgEl = document.querySelector('#rGambarPreview img');
  const bahan = bahanRows.filter(b=>b.nama.trim()!=='').map(b=>({nama:b.nama.trim(), kuantiti:b.kuantiti.trim(), unit:b.unit}));
  const payload = {
    nama, kategori: document.getElementById('rKategori').value, gambar: imgEl ? imgEl.src : null, bahan,
    cara_penyediaan: document.getElementById('rCara').value.trim(), suhu_oven: document.getElementById('rSuhu').value.trim(),
    masa_masak: document.getElementById('rMasa').value.trim(), saiz_loyang: document.getElementById('rSaiz').value.trim(),
    jumlah_hasil: document.getElementById('rHasil').value.trim(), nota: document.getElementById('rNota').value.trim(),
    tarikh_kemaskini: todayISO(),
  };
  const btn = document.getElementById('resepiSaveBtn'); btn.disabled=true; btn.textContent='Menyimpan...';
  let error;
  if(resepiEditId){
    ({error} = await supabaseClient.from('recipes').update(payload).eq('id', resepiEditId));
  } else {
    ({error} = await supabaseClient.from('recipes').insert({ ...payload, favorite:false, archived:false, tarikh_masuk: todayISO() }));
  }
  if(btn){ btn.disabled=false; btn.textContent = resepiEditId?'Kemaskini Resepi':'Simpan Resepi'; }
  if(error){ toast('Ralat simpan: ' + error.message, true); return; }
  resepiEditId = null; scannedPrefill = null;
  toast('Resepi disimpan.');
  openModule('resepi');
}

function getFilteredResepi(){

<style>

</style></head>
<body>
  <div class="head">Dapur Ibu</div>
  <div class="sub">Resepi Rasmi</div>

  <div class="section">

let scanImageBase64 = null, scanImageMediaType = null;

}
function onScanFileSelected(ev){
  const file = ev.target.files[0]; if(!file) return;
  scanImageMediaType = file.type;
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    scanImageBase64 = dataUrl.split(',')[1];
    document.getElementById('scanPreview').innerHTML = `<img src="${dataUrl}" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;">`;
    document.getElementById('scanBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}
async function runScanOCR(){
  if(!scanImageBase64) return;
  const btn = document.getElementById('scanBtn');
  const status = document.getElementById('scanStatus');
  btn.disabled = true; btn.textContent = 'Sedang membaca...';
  status.textContent = 'Tunggu sebentar, sedang baca gambar...';
  const promptText = `Anda melihat gambar resepi masakan/bakeri (tulisan tangan atau cetak), dalam Bahasa Malaysia atau Inggeris.
Salin KANDUNGAN SEBENAR sahaja daripada gambar. JANGAN reka-reka, anggar, atau lengkapkan sukatan/maklumat yang tidak jelas kelihatan.
Jika mana-mana bahagian tidak jelas atau tidak boleh dibaca, tandakan bahagian itu dengan teks "[TIDAK JELAS]".
Balas HANYA dalam JSON tepat seperti berikut. Tiada teks lain. Tiada markdown code fence.
{"nama":"","kategoriCadangan":"","bahan":[{"nama":"","kuantiti":"","unit":""}],"caraPenyediaan":"","suhuOven":"","masaMasak":"","saizLoyang":"","jumlahHasil":"","nota":""}
Untuk "unit" setiap bahan, guna salah satu sahaja: gram, kilogram, mililiter, liter, sudu teh, sudu besar, cawan, biji, lain-lain.
Untuk "kategoriCadangan", cadangkan satu sahaja daripada: ${recipeCategories.join(', ')}.`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1500, messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: scanImageMediaType, data: scanImageBase64 } },
        { type: "text", text: promptText } ] }] })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    if(!textBlock) throw new Error('Tiada respons diterima daripada sistem.');
    const clean = textBlock.text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    scannedPrefill = {
      nama: parsed.nama || '', kategori: recipeCategories.includes(parsed.kategoriCadangan) ? parsed.kategoriCadangan : 'Lain-lain',
      gambar: 'data:' + scanImageMediaType + ';base64,' + scanImageBase64, bahan: Array.isArray(parsed.bahan) ? parsed.bahan : [],
      caraPenyediaan: parsed.caraPenyediaan || '', suhuOven: parsed.suhuOven || '', masaMasak: parsed.masaMasak || '',
      saizLoyang: parsed.saizLoyang || '', jumlahHasil: parsed.jumlahHasil || '', nota: parsed.nota || '',
    };
    status.textContent = '';
    renderTambahResepi(null, true);
  } catch(err){
    status.textContent = '⚠️ Gagal baca gambar (' + err.message + '). Sila cuba gambar lain, atau isi manual melalui Tambah Resepi.';
    btn.disabled = false; btn.textContent = 'Baca Resepi (OCR)';
  }
}

init();
</script>
